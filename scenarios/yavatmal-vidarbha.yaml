name: yavatmal-vidarbha
description: >-
  Yavatmal, kharif soybean followed by rabi chickpea. The chickpea is sown on
  5 December rather than in October, because rabi planting across Vidarbha waits
  on the soybean harvest and late sowing is the norm rather than the exception.

  That detail decides the outcome. Late sowing moves grain fill out of a mild
  December and into a March running above 35 C on half of all days, which is
  where the array's canopy cooling finally earns something. Sow three weeks
  earlier and the crop escapes the heat on its own.

site:
  name: Yavatmal
  district: Yavatmal
  latitude: 20.39
  longitude: 78.13
  acres: 15
  altitude_m: 445
  agroclimatic_zone: Vidarbha, moderate rainfall dryland

array:
  collector_width: 2.3
  pitch: 9.0
  tilt: 18.0
  azimuth: 180.0
  clearance_height: 4.0

weather:
  start_year: 2019
  end_year: 2023

# Soil water carried into the season: medium-deep black cotton soil.
crops:
  - key: soybean_kharif
    irrigation_mm: 0
    grown_in_baseline: true
    residual_moisture_mm: 130
  - key: chickpea_rabi_late
    irrigation_mm: 0
    grown_in_baseline: true
    residual_moisture_mm: 130
