name: nashik-horticulture
description: >-
  Nashik, the high-value case. Rabi onion is shade tolerant and worth an order of magnitude more per tonne than a cereal, so this is where the crop line can genuinely move the project economics rather than being a rounding error against the energy revenue.

site:
  name: Nashik
  district: Nashik
  latitude: 20.00
  longitude: 73.79
  acres: 15
  altitude_m: 600
  agroclimatic_zone: Assured rainfall, horticultural

array:
  collector_width: 2.3
  pitch: 9.0
  tilt: 18.0
  azimuth: 180.0
  clearance_height: 4.0

weather:
  start_year: 2019
  end_year: 2023

# Soil water carried into the season: medium soil, though this block is drip irrigated anyway.
crops:
  - key: onion_rabi
    irrigation_mm: 350
    grown_in_baseline: true
    residual_moisture_mm: 60
